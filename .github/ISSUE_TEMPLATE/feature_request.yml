name: Feature request
description: Suggest an improvement to Tabula Mentis
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this request.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or user need is not served today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain the desired behavior rather than only its UI.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: data-impact
    attributes:
      label: Vault, privacy, or compatibility impact
      description: Would this change stored data, filesystem access, or portability?
  - type: textarea
    id: context
    attributes:
      label: Additional context
