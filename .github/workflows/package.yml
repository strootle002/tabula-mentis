name: Package desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-latest # Apple Silicon (arm64)
          - macos-15-intel # Intel (x86_64)
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build platform bundles
        run: npm run tauri build

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabula-mentis-${{ runner.os }}-${{ runner.arch }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  notice:
    name: Distribution notice
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Explain artifact status
        run: |
          echo "Artifacts remain attached to this workflow run."
          echo "This workflow does not create a GitHub Release or publish updates."
          echo "Code signing and notarization require separately configured secrets."
